<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container mt-5">
        <!-- Título -->
        <h2 class="text-center mb-4"><i class="fas fa-shopping-cart"></i> Gestión de Ventas</h2>

        <!-- Formulario de Venta -->
        <div class="form-container p-4 border rounded shadow-sm bg-light">
            <form id="ventaForm">
                <div class="form-row align-items-end">
                    <div class="form-group col-md-6">
                        <label for="producto">Producto:</label>
                        <select id="producto" name="producto" class="form-control" required>
                            <!-- Opciones de productos se cargarán dinámicamente -->
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" name="cantidad" class="form-control" min="1" required>
                    </div>
                    <div class="form-group col-md-2 text-center">
                        <button type="button" class="btn btn-primary btn-block" id="agregarProducto">
                            <i class="fas fa-plus"></i> Agregar
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Detalle de Venta -->
        <h3 class="text-center mt-4"><i class="fas fa-list-alt"></i> Detalle de Venta</h3>
        <table class="table table-bordered table-striped mt-3">
            <thead class="thead-dark">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="detalleVentaBody">
                <!-- Productos agregados dinámicamente -->
            </tbody>
        </table>

        <!-- Total y botón de registro -->
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="font-weight-bold">Total: $<span id="totalVenta">0.00</span></h4>
            <button type="button" class="btn btn-success" id="registrarVenta">
                <i class="fas fa-check"></i> Registrar Venta
            </button>
        </div>

        <!-- Historial de Ventas -->
        <h2 class="text-center mt-5"><i class="fas fa-history"></i> Historial de Ventas</h2>

        <!-- Botón para descargar reporte alineado a la derecha -->
        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-danger" id="descargarPDF">
                <i class="fas fa-file-pdf"></i> Descargar Reporte PDF
            </button>
        </div>

        <table class="table table-bordered table-striped mt-3">
            <thead class="thead-dark">
                <tr>
                    <th>ID Venta</th>
                    <th>Fecha</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="ventasTableBody">
                <!-- Historial de ventas se llenará dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- Modal de Confirmación de Venta -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel"><i class="fas fa-check-circle"></i> Venta Registrada
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    La venta ha sido registrada exitosamente.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Ventas/crearVentas.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</body>

</html>
