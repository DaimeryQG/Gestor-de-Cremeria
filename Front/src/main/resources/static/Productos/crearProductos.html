<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4 title"><i class="fas fa-box"></i> Gestión de Productos</h2>
        <div class="form-container p-4 border rounded shadow-sm">
            <form id="productoForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="descripcion">Descripción:</label>
                        <input type="text" id="descripcion" name="descripcion" class="form-control">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="precio">Precio:</label>
                        <input type="number" id="precio" name="precio" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="stock">Stock:</label>
                        <input type="number" id="stock" name="stock" class="form-control" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="fecha_caducidad">Fecha de Caducidad:</label>
                        <input type="date" id="fecha_caducidad" name="fecha_caducidad" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria" class="form-control" required>
                            <!-- Opciones dinámicas -->
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="proveedor">Proveedor:</label>
                        <select id="proveedor" name="proveedor" class="form-control" required>
                            <!-- Opciones dinámicas -->
                        </select>
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="activo" name="activo" class="form-check-input" checked>
                    <label for="activo" class="form-check-label">Activo</label>
                </div>
                <button type="submit" class="btn btn-success mt-3">
                    <i class="fas fa-save"></i> Guardar Producto
                </button>
            </form>
        </div>

        <!-- Botón de carga masiva alineado a la derecha debajo del formulario -->
        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-info px-4 py-2" data-toggle="modal" data-target="#csvModal"
                style="font-size: 1.1rem; font-weight: 500;">
                <i class="fas fa-file-upload"></i> Carga Masiva
            </button>
        </div>

        <!-- Modal para carga masiva -->
        <div class="modal fade" id="csvModal" tabindex="-1" role="dialog" aria-labelledby="csvModalLabel"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="csvModalLabel"><i class="fas fa-file-csv"></i> Subir Archivo CSV
                        </h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="csvUploadForm">
                            <div class="form-group">
                                <label for="csvFile"><i class="fas fa-file"></i> Seleccionar archivo CSV:</label>
                                <input type="file" id="csvFile" accept=".csv" class="form-control" required>
                            </div>
                            <button type="button" id="uploadCsvButton" class="btn btn-primary btn-block">
                                <i class="fas fa-upload"></i> Subir CSV
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-center mt-5"><i class="fas fa-list"></i> Lista de Productos</h2>
        <table class="table table-bordered table-striped mt-3">
            <thead class="thead-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Proveedor</th>
                    <th>Fecha de Caducidad</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productosTableBody">
                <!-- Datos de productos se llenarán dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- Modal de éxito al agregar un producto -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel"><i class="fas fa-check-circle"></i> Producto Agregado
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    El producto ha sido agregado exitosamente a la lista.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Productos/crearProductos.js"></script>
</body>

</html>
