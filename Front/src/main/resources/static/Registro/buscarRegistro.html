<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo CSS personalizado -->
    <link rel="stylesheet" href="/css/styles.css"> <!-- Cambiado a "style.css" -->
</head>
<body>
    <div class="container mt-5">
        <div class="form-container p-4 border rounded shadow-sm">
            <h2 class="text-center mb-4">Buscar Registro</h2>
            <form id="searchForm" class="d-flex justify-content-between">
                <!-- Selector para elegir la opción de búsqueda -->
                <div class="form-group mr-2">
                    <label for="searchOption">Buscar por:</label>
                    <select id="searchOption" class="form-control">
                        <option value="nombre">Nombre</option>
                        <option value="rfc">RFC</option>
                        <option value="curp">CURP</option>
                    </select>
                </div>

                <!-- Campo de entrada para el valor de búsqueda -->
                <div class="form-group mr-2">
                    <input type="text" id="searchInput" class="form-control" placeholder="Ingrese el valor" required>
                </div>

                <!-- Botones -->
                <div class="form-group ml-2 d-flex align-items-center">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <!-- Botón de Crear que redirige a otro HTML -->
                    <button type="button" class="btn btn-success ml-2" id="createButton">Crear</button>
                </div>
            </form>
        </div>

        <!-- Detalles del usuario -->
        <div id="userDetails" class="details-container mt-4 p-4 border rounded shadow-sm" style="display: none;">
            <h3>Detalles del Registro</h3>
            <p class="detail-item"><strong>Nombre:</strong> <span id="nombre"></span></p>
            <p class="detail-item"><strong>Correo:</strong> <span id="correo"></span></p>
            <p class="detail-item"><strong>Teléfono:</strong> <span id="telefono"></span></p>
            <p class="detail-item"><strong>Dirección:</strong> <span id="direccion"></span></p>
            <p class="detail-item"><strong>RFC:</strong> <span id="rfc"></span></p>
            <p class="detail-item"><strong>CURP:</strong> <span id="curp"></span></p>
            <p class="detail-item"><strong>País:</strong> <span id="pais"></span></p>
            <p class="detail-item"><strong>Estado:</strong> <span id="estado"></span></p>
            <p class="detail-item"><strong>Fecha de Registro:</strong> <span id="fechaRegistro"></span></p>
            <p class="detail-item"><strong>Username:</strong> <span id="username"></span></p>
            <p class="detail-item"><strong>Rol:</strong> <span id="rolNombre"></span></p>

            <div class="button-group mt-3 d-flex justify-content-between">
                <button id="updateButton" class="btn btn-primary">Actualizar</button>
                <button id="deleteButton" class="btn btn-danger">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Modal de error -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error de Búsqueda</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Por favor, ingrese un término de búsqueda válido.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección para mostrar múltiples registros -->
    <div id="userList" class="list-container mt-4 p-4 border rounded shadow-sm" style="display: none;">
        <h3>Registros encontrados</h3>
        <ul id="registroList" class="list-group"></ul>
    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Tu script personalizado -->
    <script src="/js/Registros/buscarRegistro.js"></script>
    
</body>
</html>
