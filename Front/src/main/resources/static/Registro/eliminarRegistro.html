<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Usuario</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4 title"><i class="fas fa-user"></i> Detalles del Usuario</h2>

        <!-- Formulario de Detalles -->
        <div class="form-container p-4 border rounded shadow-sm">
            <form id="detailsForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" class="form-control" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" class="form-control" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" class="form-control" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" class="form-control" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="rfc">RFC:</label>
                        <input type="text" id="rfc" class="form-control" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="curp">CURP:</label>
                        <input type="text" id="curp" class="form-control" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="pais">País:</label>
                        <input type="text" id="pais" class="form-control" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" class="form-control" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="fechaRegistro">Fecha de Registro:</label>
                        <input type="text" id="fechaRegistro" class="form-control" disabled>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="username">Username:</label>
                        <input type="text" id="username" class="form-control" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rolNombre">Rol:</label>
                    <input type="text" id="rolNombre" class="form-control" disabled>
                </div>

                <!-- Botones -->
                <div class="text-center mt-4">
                    <button type="button" id="activarButton" class="btn btn-success mr-2"><i class="fas fa-check-circle"></i> Activar</button>
                    <button type="button" id="desactivarButton" class="btn btn-secondary mr-2"><i class="fas fa-ban"></i> Desactivar</button>
                    <button type="button" id="deleteButton" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar Usuario</button>
                </div>

                <div class="text-center mt-3">
                    <a href="/Registro/buscarRegistro.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación de Eliminar -->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalLabel"><i class="fas fa-exclamation-triangle"></i> Confirmar Eliminación</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Mensajes -->
    <div class="modal fade" id="messageModal" tabindex="-1" role="dialog" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="messageModalLabel"><i class="fas fa-info-circle"></i> Mensaje</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- El contenido se agregará dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.3/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/Registros/eliminarRegistro.js"></script>

</body>
</html>
