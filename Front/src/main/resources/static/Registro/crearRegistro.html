<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Registro</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        .modal-content { border-radius: 10px; }
        .modal-header { background-color: #28a745; color: white; }
        .modal-body { background-color: #f9f9f9; }
        .form-group label { font-weight: bold; }
        .form-control { margin-bottom: 15px; }
        .btn { width: 100%; }
    </style>
</head>
<body>
    <div class="container mt-5 text-center">
        <button class="btn btn-success" data-toggle="modal" data-target="#createModal"><i class="fas fa-plus"></i> Crear Nuevo Registro</button>
    </div>

    <!-- Modal de Crear Registro -->
    <div class="modal fade" id="createModal" tabindex="-1" role="dialog" aria-labelledby="createModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createModalLabel">Crear Nuevo Registro</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="createForm">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="nombre">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingrese el nombre" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="correo">Correo:</label>
                                <input type="email" id="correo" name="correo" class="form-control" placeholder="Ingrese el correo" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="telefono">Teléfono:</label>
                                <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ingrese el teléfono">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="direccion">Dirección:</label>
                                <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Ingrese la dirección">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="rfc">RFC:</label>
                                <input type="text" id="rfc" name="rfc" class="form-control" placeholder="Ingrese el RFC">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="curp">CURP:</label>
                                <input type="text" id="curp" name="curp" class="form-control" placeholder="Ingrese el CURP">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="pais">País:</label>
                                <input type="text" id="pais" name="pais" class="form-control" placeholder="Ingrese el país">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="estado">Estado:</label>
                                <input type="text" id="estado" name="estado" class="form-control" placeholder="Ingrese el estado">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="fechaRegistro">Fecha de Registro:</label>
                                <input type="date" id="fechaRegistro" name="fechaRegistro" class="form-control">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="username">Username:</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese el username">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="password">Contraseña:</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese la contraseña">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="rol">Rol:</label>
                                <select id="rol" name="rol" class="form-control">
                                    <option value="1">Administrador</option>
                                    <option value="4">Almacenista</option>
                                    <option value="3">Proveedor</option>
                                    <option value="2">Vendedor</option>
                                </select>
                            </div>
                        </div>

                        <button id="createButton" class="btn btn-success mt-3"><i class="fas fa-plus"></i> Crear Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/Registros/crearRegistro.js"></script>
</body>
</html>
