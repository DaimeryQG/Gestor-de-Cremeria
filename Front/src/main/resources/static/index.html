<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Tatiscrema</title>
  <link href="/bootstrap/dist/css/bootstrap.min.css?v=1.0.0" rel="stylesheet">
  <link href="/css/styles.css?v=1.0.2" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 custom-card">
      <div class="text-center mb-4">
        <img src="/images/LogoTatis.png" alt="Tatiscrema Logo" class="logo">
      </div>
      <div class="text-center mb-4">
        <h3 class="title">Cremería Tatis</h3>
        <p class="subtitle">Bienvenido, por favor inicia sesión.</p>
      </div>
      <form id="loginForm" method="POST" action="/login">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Nombre de usuario">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" name="remember">
          <label class="form-check-label" for="remember">Recordarme</label>
        </div>
        <div class="d-flex flex-column mt-4 gap-3">
          <button type="submit" class="btn btn-primary btn-lg">Iniciar Sesión</button>
          <button type="button" class="btn btn-secondary btn-lg" id="clearButton">Limpiar</button>
        </div>
      </form>

      <!-- Mensaje de campos vacíos -->
      <div id="empty-fields-message" class="mt-3 text-danger text-center" style="display: none;">
        <p>Por favor, ingrese usuario y contraseña.</p>
      </div>

      <!-- Mensaje de error -->
      <div id="error-message" class="mt-3 text-danger text-center" style="display: none;">
        <p>No tienes suficientes privilegios</p>
      </div>

      <!-- Ventana emergente de éxito -->
      <div id="success-message" class="modal fade" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="successModalLabel">¡Éxito!</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p>Inicio de sesión correcto.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="/Registro/buscarRegistro.html">¿No tienes cuenta? Regístrate aquí.</a>
      </div>
    </div>
  </div>

  <script src="/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
